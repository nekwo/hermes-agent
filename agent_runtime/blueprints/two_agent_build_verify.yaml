id: two_agent_build_verify
version: 1
title: Two-Agent Build/Verify Blueprint
description: Builder produces a result, verifier checks it, failures route back to builder.
slots:
  - id: builder
    role: builder
    required: true
  - id: verifier
    role: verifier
    required: true
stages:
  - id: implement
    title: Implement
    objective: Implement or fix the requested scope.
    owner_slot: builder
    repo: hermes-agent
    kind: implementation
    blocks_qa_until: true
    proof_gate:
      required: true
      minimum_status: passed
      required_proof_types: [test_run]
  - id: verify
    title: Verify
    objective: Verify the implementation with concrete evidence.
    owner_slot: verifier
    repo: hermes-agent
    kind: qa_verdict
    depends_on: [implement]
    blocks_qa_until: false
    proof_gate:
      required: true
      minimum_status: approved
      required_proof_types: [qa_verdict]
edges:
  - source: implement
    outcome: passed
    target: verify
  - source: implement
    outcome: blocked
    target: intervention
  - source: verify
    outcome: passed
    target: done
  - source: verify
    outcome: failed
    target: implement
  - source: verify
    outcome: needs_fixes
    target: implement
  - source: verify
    outcome: blocked
    target: intervention
limits:
  max_attempts_per_stage: 2
  max_total_stages: 4
on_unhandled: intervention
