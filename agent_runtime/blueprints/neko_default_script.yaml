id: neko_default_script
version: 1
title: Neko default root script
description: Root node authors stages dynamically for the current goal.
slots:
  - id: root
    role: neko
  - id: dev
    role: dev
  - id: qa
    role: qa
stages: []
edges: []
agent_topology:
  root: root
  edges:
    - source: root
      target: dev
      kind: steers
    - source: root
      target: qa
      kind: steers
limits:
  max_attempts_per_stage: 2
  max_total_stages: 20
on_unhandled: intervention
