id: neko_dev_qa_basic
version: 1
title: Neko Dev QA Basic
description: Mission lead scopes work, builder implements it, verifier checks proof.
slots:
  - id: lead
    role: neko
    required: true
    description: Mission lead that clarifies scope and routes recovery.
  - id: builder
    role: builder
    required: true
    description: Agent that implements the scoped work.
  - id: verifier
    role: verifier
    required: true
    description: Agent that verifies implementation and proof.
stages:
  - id: scope
    title: Scope
    objective: Clarify scope, acceptance criteria, and proof expectation.
    owner_slot: lead
    repo: hermes-agent
    kind: scope
    blocks_qa_until: false
    proof_gate:
      required: false
  - id: implement
    title: Implement
    objective: Implement the scoped work and attach proof.
    owner_slot: builder
    repo: hermes-agent
    kind: implementation
    depends_on: [scope]
    blocks_qa_until: true
    proof_gate:
      required: true
      minimum_status: passed
      required_proof_types: [test_run]
  - id: verify
    title: Verify
    objective: Verify implementation and proof.
    owner_slot: verifier
    repo: hermes-agent
    kind: qa_verdict
    depends_on: [implement]
    blocks_qa_until: false
    proof_gate:
      required: true
      minimum_status: approved
      required_proof_types: [qa_verdict]
edges:
  - source: scope
    outcome: ready
    target: implement
  - source: scope
    outcome: missing_input
    target: intervention
  - source: implement
    outcome: passed
    target: verify
  - source: implement
    outcome: blocked
    target: scope
  - source: verify
    outcome: passed
    target: done
  - source: verify
    outcome: failed
    target: scope
  - source: verify
    outcome: needs_fixes
    target: implement
  - source: verify
    outcome: blocked
    target: intervention
agent_topology:
  root: lead
  edges:
    - source: lead
      target: builder
      kind: steers
    - source: builder
      target: verifier
      kind: steers
limits:
  max_attempts_per_stage: 3
  max_total_stages: 16
on_unhandled: intervention
