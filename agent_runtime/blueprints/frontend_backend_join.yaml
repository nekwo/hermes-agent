id: frontend_backend_join
version: 1
title: Frontend/Backend Join
description: Backend contract proof releases frontend implementation, then QA verifies the joined behavior.
slots:
  - id: backend
    role: backend_dev
    required: true
    description: Agent that proves or updates the backend contract.
  - id: frontend
    role: builder
    required: true
    description: Agent that consumes the backend contract in the frontend.
  - id: verifier
    role: verifier
    required: true
    description: Agent that verifies joined frontend/backend proof.
stages:
  - id: backend_contract
    title: Backend Contract
    objective: Produce backend contract proof or a bounded compatibility packet.
    owner_slot: backend
    repo: EterniaBackend
    kind: proof_only
    proof_recipe_id: backend_contract_smoke
    blocks_qa_until: true
    proof_gate:
      required: true
      minimum_status: passed
      required_proof_types: [test_run]
      proof_recipe_id: backend_contract_smoke
  - id: frontend_implementation
    title: Frontend Implementation
    objective: Consume backend contract proof and implement the frontend side.
    owner_slot: frontend
    repo: EterniaLauncher
    kind: implementation
    depends_on: [backend_contract]
    blocks_qa_until: true
    proof_gate:
      required: true
      minimum_status: passed
      required_proof_types: [test_run]
  - id: verify_join
    title: Verify Join
    objective: Verify backend proof and frontend proof cover the joined behavior.
    owner_slot: verifier
    repo: hermes-agent
    kind: qa_verdict
    depends_on: [backend_contract, frontend_implementation]
    blocks_qa_until: false
    proof_gate:
      required: true
      minimum_status: approved
      required_proof_types: [qa_verdict]
edges:
  - source: backend_contract
    outcome: passed
    target: frontend_implementation
  - source: backend_contract
    outcome: failed
    target: intervention
  - source: backend_contract
    outcome: blocked
    target: intervention
  - source: frontend_implementation
    outcome: passed
    target: verify_join
  - source: frontend_implementation
    outcome: blocked
    target: backend_contract
  - source: verify_join
    outcome: passed
    target: done
  - source: verify_join
    outcome: failed
    target: frontend_implementation
  - source: verify_join
    outcome: needs_fixes
    target: frontend_implementation
  - source: verify_join
    outcome: blocked
    target: intervention
agent_topology:
  root: backend
  edges:
    - source: backend
      target: frontend
      kind: steers
    - source: frontend
      target: verifier
      kind: steers
limits:
  max_attempts_per_stage: 3
  max_total_stages: 12
on_unhandled: intervention
