id: visual_ui_qa
version: 1
title: Visual UI QA
description: UI implementation flow that requires command proof and visual screenshot or video proof before QA approval.
slots:
  - id: builder
    role: builder
    required: true
    description: Agent that implements the UI change and captures visual proof.
  - id: verifier
    role: verifier
    required: true
    description: Agent that verifies the UI proof and final behavior.
stages:
  - id: implement_ui
    title: Implement UI
    objective: Implement the UI change and attach focused test proof plus a screenshot or video.
    owner_slot: builder
    repo: EterniaLauncher
    kind: implementation
    requires_visual_proof: true
    blocks_qa_until: true
    proof_gate:
      required: true
      minimum_status: passed
      required_proof_types: [test_run, screenshot]
  - id: visual_verify
    title: Visual Verify
    objective: Verify the screenshot or video is nonblank, current, and covers the requested UI behavior.
    owner_slot: verifier
    repo: EterniaLauncher
    kind: qa_verdict
    depends_on: [implement_ui]
    blocks_qa_until: false
    proof_gate:
      required: true
      minimum_status: approved
      required_proof_types: [qa_verdict]
edges:
  - source: implement_ui
    outcome: passed
    target: visual_verify
  - source: implement_ui
    outcome: failed
    target: intervention
  - source: implement_ui
    outcome: blocked
    target: intervention
  - source: visual_verify
    outcome: passed
    target: done
  - source: visual_verify
    outcome: failed
    target: implement_ui
  - source: visual_verify
    outcome: needs_fixes
    target: implement_ui
  - source: visual_verify
    outcome: blocked
    target: intervention
limits:
  max_attempts_per_stage: 2
  max_total_stages: 6
on_unhandled: intervention
