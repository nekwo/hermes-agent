id: one_agent_smoke
version: 1
title: One-Agent Smoke Blueprint
description: Smallest headless blueprint flow for a single bound builder.
slots:
  - id: builder
    role: builder
    required: true
    description: Agent that performs the smoke objective.
stages:
  - id: build
    title: Build
    objective: Complete the requested smoke objective and report proof.
    owner_slot: builder
    repo: hermes-agent
    kind: implementation
    blocks_qa_until: true
edges:
  - source: build
    outcome: passed
    target: done
  - source: build
    outcome: failed
    target: intervention
  - source: build
    outcome: blocked
    target: intervention
limits:
  max_attempts_per_stage: 1
  max_total_stages: 1
on_unhandled: intervention
