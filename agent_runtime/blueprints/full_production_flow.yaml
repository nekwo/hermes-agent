id: full_production_flow
version: 1
title: Full Production Flow
description: Release-grade frontend/backend flow with lead scoping, ordered proof promotion, QA, staging, rollout proof, and final review.
slots:
  - id: lead
    role: neko
    required: true
    description: Mission lead that scopes work and owns recovery routing.
  - id: backend
    role: backend_dev
    required: true
    description: Backend specialist for contract and deploy proof.
  - id: frontend
    role: builder
    required: true
    description: Frontend specialist for Launcher/UI implementation.
  - id: verifier
    role: verifier
    required: true
    description: QA verifier for local and staging evidence.
  - id: reviewer
    role: reviewer
    required: true
    description: Final reviewer for production rollout proof and release verdict.
stages:
  - id: scope
    title: Scope
    objective: Clarify production scope, non-goals, ordered proof gates, and rollback expectations.
    owner_slot: lead
    repo: hermes-agent
    kind: scope
    blocks_qa_until: false
    proof_gate:
      required: false
  - id: backend_contract
    title: Backend Contract
    objective: Produce or update backend contract proof before frontend consumption.
    owner_slot: backend
    repo: EterniaBackend
    kind: proof_only
    depends_on: [scope]
    proof_recipe_id: backend_contract_smoke
    blocks_qa_until: true
    proof_gate:
      required: true
      minimum_status: passed
      required_proof_types: [test_run]
      proof_recipe_id: backend_contract_smoke
  - id: frontend_implementation
    title: Frontend Implementation
    objective: Implement the Launcher/frontend side against the backend contract.
    owner_slot: frontend
    repo: EterniaLauncher
    kind: implementation
    depends_on: [backend_contract]
    blocks_qa_until: true
    proof_gate:
      required: true
      minimum_status: passed
      required_proof_types: [test_run]
  - id: local_self_test
    title: Local Self Test
    objective: Run local deterministic proof covering backend contract and frontend implementation.
    owner_slot: frontend
    repo: hermes-agent
    kind: proof_only
    depends_on: [frontend_implementation]
    blocks_qa_until: true
    proof_gate:
      required: true
      minimum_status: passed
      required_proof_types: [test_run]
  - id: qa_verify
    title: QA Verify
    objective: Verify attached backend, frontend, and local proof before staging.
    owner_slot: verifier
    repo: hermes-agent
    kind: qa_verdict
    depends_on: [backend_contract, frontend_implementation, local_self_test]
    blocks_qa_until: false
    proof_gate:
      required: true
      minimum_status: approved
      required_proof_types: [qa_verdict]
  - id: staging_smoke
    title: Staging Smoke
    objective: Validate the release candidate in staging before production rollout.
    owner_slot: verifier
    repo: hermes-agent
    kind: proof_only
    depends_on: [qa_verify]
    blocks_qa_until: true
    proof_gate:
      required: true
      minimum_status: passed
      required_proof_types: [test_run]
  - id: production_rollout_proof
    title: Production Rollout Proof
    objective: Attach ordered production rollout proof and rollback notes.
    owner_slot: backend
    repo: EterniaBackend
    kind: proof_only
    depends_on: [staging_smoke]
    blocks_qa_until: true
    proof_gate:
      required: true
      minimum_status: passed
      required_proof_types: [test_run, log]
  - id: final_verdict
    title: Final Verdict
    objective: Review production proof and record final release verdict.
    owner_slot: reviewer
    repo: hermes-agent
    kind: qa_verdict
    depends_on: [production_rollout_proof]
    blocks_qa_until: false
    proof_gate:
      required: true
      minimum_status: approved
      required_proof_types: [qa_verdict]
edges:
  - source: scope
    outcome: ready
    target: backend_contract
  - source: scope
    outcome: missing_input
    target: intervention
  - source: backend_contract
    outcome: passed
    target: frontend_implementation
  - source: backend_contract
    outcome: blocked
    target: scope
  - source: frontend_implementation
    outcome: passed
    target: local_self_test
  - source: frontend_implementation
    outcome: blocked
    target: scope
  - source: local_self_test
    outcome: passed
    target: qa_verify
  - source: local_self_test
    outcome: failed
    target: frontend_implementation
  - source: qa_verify
    outcome: passed
    target: staging_smoke
  - source: qa_verify
    outcome: failed
    target: scope
  - source: qa_verify
    outcome: needs_fixes
    target: frontend_implementation
  - source: staging_smoke
    outcome: passed
    target: production_rollout_proof
  - source: staging_smoke
    outcome: failed
    target: scope
  - source: production_rollout_proof
    outcome: passed
    target: final_verdict
  - source: production_rollout_proof
    outcome: blocked
    target: intervention
  - source: final_verdict
    outcome: passed
    target: done
  - source: final_verdict
    outcome: failed
    target: scope
  - source: final_verdict
    outcome: blocked
    target: intervention
limits:
  max_attempts_per_stage: 3
  max_total_stages: 24
on_unhandled: intervention
