id: neko_single_dev
version: 1
title: Neko Single Dev
description: Neko scopes one bounded repo lane, then one Dev specialist implements and proves it.
slots:
  - id: lead
    role: neko
    required: true
    description: Mission lead that confirms scope and releases one specialist.
  - id: builder
    role: dev
    required: true
    description: Single Dev specialist for the requested repo scope.
stages:
  - id: scope
    title: Scope
    objective: Confirm scope, acceptance criteria, proof expectations, and release the single repo lane.
    owner_slot: lead
    repo: hermes-agent
    kind: scope
    blocks_qa_until: false
    proof_gate:
      required: false
  - id: implement
    title: Implementation
    objective: Implement or document the requested repo slice and attach the focused proof named by the goal.
    owner_slot: builder
    repo: hermes-agent
    kind: implementation
    depends_on: [scope]
    blocks_qa_until: false
    proof_gate:
      required: true
      minimum_status: passed
      required_proof_types: [test_run]
edges:
  - source: scope
    outcome: ready
    target: implement
  - source: scope
    outcome: missing_input
    target: intervention
  - source: implement
    outcome: passed
    target: done
  - source: implement
    outcome: needs_fixes
    target: implement
  - source: implement
    outcome: blocked
    target: scope
agent_topology:
  root: lead
  edges:
    - source: lead
      target: builder
      kind: steers
limits:
  max_attempts_per_stage: 2
  max_total_stages: 8
on_unhandled: intervention
